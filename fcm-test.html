<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FCM Diagnostic Test</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>FCM Diagnostic Test</h2>
  <button id="btn" style="padding: 10px 20px; font-size: 16px;">Test FCM Subscription</button>
  <pre id="log" style="background: #f4f4f4; padding: 15px; margin-top: 20px; border-radius: 8px; white-space: pre-wrap; word-break: break-all;"></pre>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += msg + '\n\n';
    }

    document.getElementById('btn').addEventListener('click', async () => {
      log("Initializing Firebase...");
      try {
        const config = {
          apiKey: "AIzaSyD2PpMl6jeHehj6GlNS5B1Uni6pos7UkJc",
          authDomain: "stacpaganur.firebaseapp.com",
          projectId: "stacpaganur",
          storageBucket: "stacpaganur.firebasestorage.app",
          messagingSenderId: "495839870905",
          appId: "1:495839870905:web:f9f8ab0446292689a50068"
        };
        if (!firebase.apps.length) {
          firebase.initializeApp(config);
        }
        log("Firebase initialized.");

        log("Requesting Notification Permission...");
        const permission = await Notification.requestPermission();
        log("Permission status: " + permission);
        
        if (permission === 'granted') {
          log("Registering Service Worker...");
          const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
          log("Service Worker registered. Getting Token...");

          const messaging = firebase.messaging();
          const token = await messaging.getToken({
            vapidKey: "BNtMXIN9ne7Nk_kcqnH3wOR57UrCZorPhWJK3kj-RcjHnvxBTHMi_CdeyCJEKTsDVqImDPU34CgWUZ7gNC-GT5A",
            serviceWorkerRegistration: registration
          });
          
          log("SUCCESS! Token generated:\n" + token);
        }
      } catch (err) {
        log("ERROR:\n" + err.name + ": " + err.message);
        console.error(err);
      }
    });
  </script>
</body>
</html>
